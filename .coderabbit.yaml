# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit

language: en-US
early_access: false

reviews:
  profile: "chill"
  high_level_summary: false
  poem: false
  request_changes_workflow: false
  collapse_walkthrough: true

  path_filters:
    - "!vendor/**"
    - "!**/vendor/**"
    - "!**/zz_generated*"
    - "!go.sum"
    # Upstream-only files not used in our CI
    - "!.github/**"

  path_instructions:
    - path: "cluster-autoscaler/cloudprovider/openshift/**/*.go"
      instructions: |
        This is the downstream-only OpenShift cloud provider for Cluster
        Autoscaler. It integrates with MachineSet-based node autoscaling.
        Review for correct MachineSet API usage, proper error handling,
        and thread safety in node group operations.

    - path: "cluster-autoscaler/core/**/*.go"
      instructions: |
        Core scaling logic for Cluster Autoscaler. Changes here have wide
        blast radius. Review for correct scale-up/scale-down decision
        logic, proper handling of unschedulable pods, and node group
        lifecycle management.

    - path: "cluster-autoscaler/cloudprovider/clusterapi/**/*.go"
      instructions: |
        The upstream Cluster API provider — one of two providers OpenShift
        actually uses. OpenShift carries a patch for paused-resource
        awareness. Review changes here carefully as they affect node
        autoscaling for all OpenShift clusters.

    - path: "cluster-autoscaler/apis/**/*.go"
      instructions: |
        Review API types for backward compatibility, correct JSON tags,
        and deepcopy compliance. API changes require regenerating
        clientsets. Check that generated files in client/ subdirectories
        are not hand-edited.

    - path: "vertical-pod-autoscaler/pkg/apis/**/*.go"
      instructions: |
        VPA CRD API types. Review for backward compatibility, correct
        JSON tags with omitempty on optional fields, and deepcopy
        compliance. API changes require regenerating clientsets and
        deepcopy via hack/update-codegen.sh. Typically changes should
        only be made upstream.

    - path: "vertical-pod-autoscaler/pkg/recommender/**/*.go"
      instructions: |
        VPA recommender computes resource recommendations from metrics.
        Review for correct resource estimation, proper metrics handling,
        and numerical stability in recommendation algorithms. Typically
        changes should only be made upstream.

    - path: "vertical-pod-autoscaler/pkg/admission-controller/**/*.go"
      instructions: |
        VPA admission webhook applies recommendations to new pods.
        Review for correct mutating webhook behavior, proper handling
        of container resource requests, and that recommendations are
        applied safely without disrupting pod scheduling. Typically
        changes should only be made upstream.

    - path: "vertical-pod-autoscaler/pkg/updater/**/*.go"
      instructions: |
        VPA updater applies resource recommendation updates to pods,
        either in-place or by evicting and recreating them. Review for
        safe update and eviction logic — incorrect behavior can cause
        outages. Verify PodDisruptionBudget awareness and that update
        rate limiting is preserved. Typically changes should only be
        made upstream.

    - path: "**/{Dockerfile,Dockerfile.*}"
      instructions: |
        Check for multi-stage builds, no secrets or credentials,
        and minimal image size. Dockerfile.rhel and Dockerfile.openshift
        are downstream-only product image builds.

    - path: "hack/**"
      instructions: |
        These scripts run in CI. Check for correct error handling
        (set -e), shellcheck compliance, and that the script matches
        what CI expects. hack/verify_history.sh validates upstream
        commit prefix conventions.

  tools:
    gitleaks:
      enabled: true
    golangci-lint:
      enabled: true
    hadolint:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "**/CONTRIBUTING_OPENSHIFT.md"
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
